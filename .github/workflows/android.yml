name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          echo "~~~" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:|What went wrong" -A4 build.log | head -100 >> $GITHUB_STEP_SUMMARY || true
          echo "~~~" >> $GITHUB_STEP_SUMMARY
          grep "^e: " build.log | head -20 | while read -r l; do echo "::error::$l"; done || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kimo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
