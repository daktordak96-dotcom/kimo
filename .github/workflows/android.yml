name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          TASKS="assembleDebug"
          if [ -n "$KEYSTORE_FILE" ]; then TASKS="assembleDebug assembleRelease bundleRelease"; fi
          gradle $TASKS --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          echo "~~~" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |ERROR|error:|What went wrong" -A4 build.log | head -100 >> $GITHUB_STEP_SUMMARY || true
          echo "~~~" >> $GITHUB_STEP_SUMMARY
          grep "^e: " build.log | head -20 | while read -r l; do echo "::error::$l"; done || true

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/kimo-debug.apk
          if [ -n "$KEYSTORE_FILE" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/kimo-release.apk
            cp app/build/outputs/bundle/release/app-release.aab out/kimo-release.aab
          fi

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: kimo build ${{ github.run_number }}
          files: out/*
          make_latest: true
