plugins {
    id 'com.android.application' version '8.7.1'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// کلید امضا فقط در GitHub (از Secrets) در دسترس است
def ksFile = System.getenv("KEYSTORE_FILE")

android {
    namespace "com.kimo.mayapp"
    compileSdk 36

    defaultConfig {
        applicationId "com.kimo.mayapp"
        minSdk 23
        targetSdk 36
        // هر بیلد GitHub یک عدد بالاتر می‌گیرد (لازمهٔ Google Play)
        versionCode ((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer)
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (ksFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // کتابخانه OkHttp برای ارسال درخواست به سرور پایتون
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // تبلیغات گوگل (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
